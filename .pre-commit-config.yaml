repos:
  - repo: local
    hooks:
      - id: oxlint
        name: oxlint
        entry: pnpm lint
        language: system
        pass_filenames: false
        types_or: [ts, javascript]
      - id: oxfmt
        name: oxfmt
        entry: pnpm fmt:check
        language: system
        pass_filenames: false
      - id: typecheck
        name: tsc --noEmit
        entry: pnpm typecheck
        language: system
        pass_filenames: false
        types_or: [ts]
      - id: vitest
        name: vitest
        entry: pnpm test
        language: system
        pass_filenames: false
